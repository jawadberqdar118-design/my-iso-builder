name: Build Browser OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso syslinux-common isolinux

      - name: Create Minimal Rootfs and ISO
        run: |
          mkdir -p my_iso/isolinux my_iso/casper
          
          # تثبيت نظام أساسي خفيف جداً
          sudo debootstrap --arch=amd64 bookworm ./rootfs http://deb.debian.org/debian/
          
          # ضغط النظام لملف سواتش فايز
          sudo mksquashfs ./rootfs my_iso/casper/filesystem.squashfs -noappend
          
          # نسخ ملفات الإقلاع
          cp /usr/lib/ISOLINUX/isolinux.bin my_iso/isolinux/
          cp /usr/lib/syslinux/modules/bios/*.c32 my_iso/isolinux/
          
          # إنشاء إعدادات الإقلاع البسيطة
          cat << 'EOF' > my_iso/isolinux/isolinux.cfg
          UI vesamenu.c32
          TIMEOUT 50
          DEFAULT browseros

          LABEL browseros
              SAY Booting Custom Browser OS...
              KERNEL /casper/vmlinuz
              INITRD /casper/initrd.lz
              APPEND boot=live modprobe.blacklist=ahci,ata_piix,nvme quiet splash
          EOF

          # إنشاء ملف ISO نهائي
          xorriso -as mkisofs -iso-level 3 -o browser-os-ready.iso -joliet -rock -b isolinux/isolinux.bin -c isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table my_iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browser-OS-Ready-ISO
          path: browser-os-ready.iso

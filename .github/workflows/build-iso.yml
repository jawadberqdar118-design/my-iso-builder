name: Build Full Browser OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso syslinux-common isolinux wget curl gnupg

      - name: Build System ISO
        run: |
          # إنشاء هيكلية مجلدات التوزيعة الحية
          mkdir -p iso_root/isolinux iso_root/casper
          
          # تثبيت نواة ديبيان وحزم النظام الأساسية
          sudo debootstrap --arch=amd64 bookworm ./rootfs http://deb.debian.org/debian/
          
          # تثبيت متصفح كروم وتطبيق Proton VPN داخل النظام الأساسي
          sudo chroot ./rootfs bash -c '
            apt-get update && apt-get install -y --no-install-recommends wget curl gnupg ca-certificates sudo
            
            # تثبيت Google Chrome
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
            
            # تثبيت Proton VPN
            wget -q -O /tmp/proton.deb https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release_1.0.8_all.deb
            dpkg -i /tmp/proton.deb && rm -f /tmp/proton.deb
            
            apt-get update
            apt-get install -y google-chrome-stable proton-vpn-gnome-desktop openbox tint2 pcmanfm network-manager xserver-xorg xinit
            apt-get clean
          '
          
          # ضغط النظام إلى ملف تشغيل حي
          sudo mksquashfs ./rootfs iso_root/casper/filesystem.squashfs -comp xz -noappend
          
          # نسخ ملفات الإقلاع
          cp /usr/lib/ISOLINux/isolinux.bin iso_root/isolinux/ || cp /usr/lib/isolinux/isolinux.bin iso_root/isolinux/
          cp /usr/lib/syslinux/modules/bios/*.c32 iso_root/isolinux/ || true
          
          # إنشاء ملف إقلاع النظام وقواعد عزل الهاردات
          cat << 'EOF' > iso_root/isolinux/isolinux.cfg
          UI vesamenu.c32
          TIMEOUT 50
          DEFAULT browseros

          LABEL browseros
              SAY Booting Custom Browser OS...
              KERNEL /casper/vmlinuz
              INITRD /casper/initrd.lz
              APPEND boot=live modprobe.blacklist=ahci,ata_piix,nvme quiet splash
          EOF

          # تصدير الملف بصيغة ISO نهائية
          xorriso -as mkisofs -iso-level 3 -o final-browser-os.iso -joliet -rock -b isolinux/isolinux.bin -c isolinux/boot.cat -no-emul-boot -boot-load-size 4 -boot-info-table iso_root

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Full-Browser-OS-ISO
          path: final-browser-os.iso

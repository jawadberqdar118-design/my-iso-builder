name: Build Browser OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap curl wget gnupg squashfs-tools xorriso isolinux syslinux-efi

      - name: Build ISO
        run: |
          mkdir -p browser-os && cd browser-os
          lb config noauto \
            --distribution bookworm \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer false \
            --apt-recommends false \
            --bootappend-live "boot=live components quiet splash locales=en_US.UTF-8 keyboard-layouts=us,ara keyboard-options=grp:alt_shift_toggle modprobe.blacklist=ahci,ata_piix,ata_generic,pata_acpi,nvme,nvme_core"

          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/custom.list.chroot
          xserver-xorg-core
          xserver-xorg-video-nouveau
          xserver-xorg-input-all
          x11-xserver-utils
          xinit
          openbox
          tint2
          pcmanfm
          lxterminal
          network-manager
          network-manager-gnome
          pulseaudio
          pavucontrol
          intel-microcode
          firmware-misc-nonfree
          firmware-realtek
          libgl1-mesa-dri
          curl
          wget
          gnupg
          ca-certificates
          fonts-noto-core
          fonts-noto-color-emoji
          sudo
          EOF

          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/0500-apps.hook.chroot
          #!/bin/bash
          set -e
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          wget -q -O /tmp/proton.deb https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release_1.0.8_all.deb
          dpkg -i /tmp/proton.deb && rm -f /tmp/proton.deb
          apt-get update
          apt-get install -y --no-install-recommends google-chrome-stable proton-vpn-gnome-desktop
          apt-get clean
          EOF
          chmod +x config/hooks/normal/0500-apps.hook.chroot

          mkdir -p config/includes.chroot/etc/udev/rules.d
          echo 'SUBSYSTEM=="block", ENV{ID_BUS}!="usb", ENV{UDISKS_IGNORE}="1", OPTIONS+="ignore_device"' > config/includes.chroot/etc/udev/rules.d/99-no-internal-disks.rules

          mkdir -p config/includes.chroot/etc/xdg/openbox
          cat << 'EOF' > config/includes.chroot/etc/xdg/openbox/autostart
          setxkbmap -layout "us,ara" -option "grp:alt_shift_toggle" &
          xset s off -dpms &
          tint2 &
          nm-applet &
          google-chrome-stable --start-maximized --no-first-run --no-default-browser-check &
          EOF

          mkdir -p config/includes.chroot/etc/profile.d
          cat << 'EOF' > config/includes.chroot/etc/profile.d/autostartx.sh
          if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then startx; fi
          EOF

          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browser-OS-Ready-ISO
          path: browser-os/*.iso
